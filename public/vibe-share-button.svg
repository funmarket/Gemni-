<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <defs>
    <!-- Background Pill Gradient -->
    <linearGradient id="pillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1E" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>

    <!-- Outer Drop Shadow -->
    <filter id="capsuleShadow" x="-10%" y="-20%" width="120%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Circle Drop Shadow -->
    <filter id="circleShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Text Shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Group with Capsule Shadow -->
  <g filter="url(#capsuleShadow)">
    <!-- Main Capsule Pill Body (width 360, height 70, centered at x=30, y=10) -->
    <rect 
      x="30" 
      y="10" 
      width="360" 
      height="70" 
      rx="35" 
      fill="url(#pillGrad)" 
      stroke="#D4AF37" 
      stroke-width="2.5" 
    />
  </g>

  <!-- Center Text "Vibe Share" -->
  <text 
    x="210" 
    y="53" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="24" 
    font-weight="700" 
    letter-spacing="0.5"
    filter="url(#textShadow)"
  >
    Vibe Share
  </text>

  <!-- Left Circle (Camera) -->
  <g filter="url(#circleShadow)">
    <circle 
      cx="45" 
      cy="45" 
      r="33" 
      fill="#FFFFFF" 
      stroke="#D4AF37" 
      stroke-width="3" 
    />
    <!-- Camera Icon (centered in circle cx=45, cy=45, size 30x30) -->
    <g transform="translate(30, 30)">
      <path 
        d="M18.125 5H11.875L8.75 8.75H5C3.62 8.75 2.5 9.87 2.5 11.25V22.5C2.5 23.88 3.62 25 5 25H25C26.38 25 27.5 23.88 27.5 22.5V11.25C27.5 9.87 26.38 8.75 25 8.75H21.25L18.125 5Z" 
        stroke="#000000" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
      />
      <circle 
        cx="15" 
        cy="16.25" 
        r="3.75" 
        stroke="#000000" 
        stroke-width="2.6" 
        fill="none" 
      />
    </g>
  </g>

  <!-- Right Circle (Message Bubble) -->
  <g filter="url(#circleShadow)">
    <circle 
      cx="375" 
      cy="45" 
      r="33" 
      fill="#FFFFFF" 
      stroke="#D4AF37" 
      stroke-width="3" 
    />
    <!-- MessageCircle Icon (centered in circle cx=375, cy=45, size 30x30) -->
    <g transform="translate(360, 30)">
      <path 
        d="M9.875 25A11.25 11.25 0 1 0 5 20.125L2.5 27.5Z" 
        stroke="#000000" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
      />
    </g>
  </g>
</svg>
