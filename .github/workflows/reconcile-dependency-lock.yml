name: Reconcile dependency lock for VQgemni
on:
  push:
    branches:
      - fix/vercel-react-native-peer-dependency
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate exact package lock without bypass flags
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean deterministic installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify package compilation
        run: npm run build
      - name: Commit reconciled lockfile to this PR branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: regenerate npm lockfile for React 18 dependency graph"
            git push
          fi
