name: Vibe render diagnostic (temporary)
on:
  push:
    branches:
      - fix/vibe-render-diagnostic
permissions:
  contents: read
jobs:
  browser-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install and compile current app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install browser test runtime (not committed to app)
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Reproduce Vibe navigation in Chromium and capture exceptions
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vq-vite-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { mkdirSync } from 'node:fs';
          mkdirSync('vibe-diagnostics', {recursive: true});
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors = [];
          page.on('pageerror',e => {errors.push('PAGE ERROR: '+e.stack);console.log('PAGE ERROR:',e.stack)});
          page.on('console',msg=>{if(msg.type()==='error'){const t=msg.text();errors.push('CONSOLE ERROR: '+t);console.log('CONSOLE ERROR:',t.slice(0,5000));}});
          page.on('requestfailed',r=>console.log('REQUEST FAILED:',r.url(),r.failure()?.errorText));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(6000);
          console.log('TITLE:', await page.title());
          console.log('BODY TEXT:',(await page.locator('body').innerText()).slice(0,2500));
          console.log('NAV HTML:',(await page.locator('nav').allTextContents()).slice(0,10));
          console.log('BUTTONS:',(await page.locator('button').allTextContents()).slice(0,35));
          const nav=page.locator('nav button').filter({hasText:/^vibe$/i});
          console.log('VIBE NAV COUNT:',await nav.count());
          await page.screenshot({path:'vibe-diagnostics/before.png',fullPage:true});
          if(await nav.count()===0){console.log('BLOCKED: no Vibe navigation button in current render');await browser.close();process.exitCode=2;}
          else {
            await nav.last().click({timeout:15000});
            await page.waitForTimeout(2000);
            await page.screenshot({path:'vibe-diagnostics/after.png',fullPage:true});
            const fallback=page.getByText('Something resonated off-beat',{exact:true});
            console.log('VIBE ERROR BOUNDARY:',await fallback.isVisible().catch(()=>false));
            console.log('VIBE SHARE CTA:',await page.locator('#share-vibe-cta').count());
            console.log('BROWSER ERROR COUNT:',errors.length);
            if(await fallback.isVisible().catch(()=>false))process.exitCode=3;
          }
          await browser.close();
          JS
      - name: Upload before/after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-render-diagnostics
          path: vibe-diagnostics/
          if-no-files-found: ignore
